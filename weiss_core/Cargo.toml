[package]
name = "weiss_core"
version = "1.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Deterministic Weiss Schwarz simulator core for research and RL environments."
repository = "https://github.com/victorwp288/weiss-schwarz-simulator"
homepage = "https://github.com/victorwp288/weiss-schwarz-simulator"
documentation = "https://victorwp288.github.io/weiss-schwarz-simulator/rustdoc/"
readme = "../README.md"

[lib]
name = "weiss_core"
path = "src/lib.rs"

[features]
default = []
replay-zstd = ["dep:zstd"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
test-harness = []

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
rayon = "1"
smallvec = "1"
bitvec = "1"
hashbrown = "0.14"
blake3 = "1"

tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt", "env-filter"] }
tracing-appender = { version = "0.2", optional = true }

zstd = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benches"
harness = false

[[bench]]
name = "alloc_benches"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
