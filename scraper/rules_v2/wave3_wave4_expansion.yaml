rules:
  - id: parser_v2.auto.damage_dealt_canceled_paid_draw_exact
    description: Exact paid draw when this card's damage is canceled.
    mode: exact
    priority: 1225
    match_on: body
    timing: DamageDealtCanceled
    effect_mode: draw_count
    pattern: "^(?:\\[[^\\]]+\\]\\s*)?when damage dealt by this card is canceled, you may pay the cost\\. if you do, draw (?P<draw_count>\\d+) card(?:s)?\\.?$"
    metadata:
      family: paid_draw

  - id: parser_v2.auto.self_turn_reverse_paid_burn_exact
    description: Exact self-turn paid burn on battle-opponent reverse.
    mode: exact
    priority: 1220
    match_on: body
    timing: BattleOpponentReverse
    effect_mode: deal_damage_cancelable_true
    pattern: "^(?:\\[[^\\]]+\\]\\s*)?during your turn, when this card's battle opponent becomes 【reverse】, you may pay the cost\\. if you do, deal (?P<damage>\\d+) damage to your opponent\\.\\s*\\(damage may be canceled\\)\\.?$"
    metadata:
      family: paid_burn

  - id: parser_v2.auto.on_play_or_by_act_heal_top_clock_exact
    description: Exact on-play or by-ACT top-clock heal.
    mode: exact
    priority: 1215
    match_on: body
    timing: OnPlay
    effect_mode: move_to_waiting_room
    pattern: "^when this card is placed on the stage from your hand or by the 【act】 effect of \"[^\"]+\", you may put the top card of your clock into your waiting room\\.?$"
    metadata:
      family: on_play_heal
      targets:
        - SelfClock
      target_limit: 1

  - id: parser_v2.auto.on_play_or_on_leave_paid_salvage_exact
    description: Exact paid salvage for on-play or on-leave dual trigger lines.
    mode: exact
    priority: 1210
    match_on: body
    effect_mode: move_to_hand
    pattern: "^(?:\\[[^\\]]+\\]\\s*)?when this card is placed on the stage from your hand or put into your waiting room from the stage, you may pay the cost\\. if you do, choose (?:up to )?(?:\\d+|one|a|an) character in your waiting room, and return (?:it|them) to your hand\\.?$"
    metadata:
      family: paid_salvage
      targets:
        - SelfWaitingRoom
      target_card_type: Character

  - id: parser_v2.auto.attack_named_climax_salvage_exact
    description: Exact attack trigger salvage with a named-climax gate.
    mode: exact
    priority: 1205
    match_on: body
    timing: AttackDeclaration
    effect_mode: move_to_hand
    pattern: "^when this card attacks, if a card named \"[^\"]+\" is in your climax area, you may choose(?: up to)?(?: (?:\\d+|one|a|an))? character in your waiting room, and return (?:it|them) to your hand\\.?$"
    metadata:
      family: attack_climax_salvage
      targets:
        - SelfWaitingRoom
      target_card_type: Character

  - id: parser_v2.auto.change_begin_encore_named_waitingroom_approx
    description: Approx fallback for Change to a named waiting-room target at encore step.
    mode: approx
    priority: 1190
    match_on: body
    timing: BeginEncoreStep
    effect_mode: noop_draw
    pattern: "^change\\s+\\[[^\\]]+\\]\\s+at the beginning of your encore step,(?:\\s*if this card is 【rest】,\\s*)?you may pay the cost\\. if you do, choose (?:up to )?(?:1|one)\\s*(?:a card named\\s*)?\"[^\"]+\" in your waiting room, and put it on the stage position that this card was on\\.?$"
    metadata:
      confidence: approx
      family: change_encore

  - id: parser_v2.cont.named_fragment_power_and_quoted_approx
    description: Approx fallback for name-fragment power + quoted extra text.
    mode: approx
    priority: 1185
    match_on: body
    effect_mode: add_power_self
    pattern: "^if you have another character with \"[^\"]+\" in its card name, this card gets \\+(?P<amount>\\d+) power and \"[^\"]+\"\\.?$"
    metadata:
      confidence: approx
      family: named_fragment_power
      targets:
        - This

  - id: parser_v2.auto.attack_low_board_mill_then_stage_approx
    description: Approx fallback for low-board conditional mill then stage deploy.
    mode: approx
    priority: 1180
    match_on: body
    effect_mode: noop_draw
    pattern: "^when this card attacks, if you have \\d+ or less other characters, you may put the top card of your deck into your waiting room\\. if that card is a level \\d+ or lower character, put that character on any position of your back stage\\.?$"
    metadata:
      confidence: approx
      family: conditional_mill_stage

  - id: parser_v2.auto.attack_no_backstage_mill_then_stage_approx
    description: Approx fallback for no-backstage conditional mill then stage deploy.
    mode: approx
    priority: 1175
    match_on: body
    effect_mode: noop_draw
    pattern: "^when this card attacks, if you do not have another character in your back stage, you may put the top card of your deck into your waiting room\\. if that card is a level \\d+ or lower character, put that character in any position of your back stage\\.?$"
    metadata:
      confidence: approx
      family: conditional_mill_stage

  - id: parser_v2.auto.on_play_reveal_trait_may_burn_approx
    description: Approx fallback for reveal-top trait gate with optional burn.
    mode: approx
    priority: 1170
    match_on: body
    effect_mode: noop_draw
    pattern: "^when this card is placed on the stage from your hand, reveal the top card of your deck\\. if that card is a 《[^》]+》 character, you may deal one damage to your opponent\\. \\(this damage may be canceled\\. the revealed card is returned to its original place\\)\\.?$"
    metadata:
      confidence: approx
      family: reveal_top_conditional

  - id: parser_v2.auto.on_play_reveal_event_or_trait_marker_approx
    description: Approx fallback for reveal-top event/trait marker conversion.
    mode: approx
    priority: 1165
    match_on: body
    effect_mode: noop_draw
    pattern: "^when this card is placed on the stage from your hand, reveal the top card of your deck\\. if that card is an event or a 《[^》]+》 character, you may put it face up underneath this card as a marker\\. \\(otherwise, return it to its original place\\)\\.?$"
    metadata:
      confidence: approx
      family: reveal_top_conditional

  - id: parser_v2.auto.frontal_attacked_look_top_exact
    description: Exact frontal-attacked top-card look decision.
    mode: exact
    priority: 1195
    match_on: body
    effect_mode: look_top_card_top_or_waiting_room
    pattern: "^when this card is frontal attacked, look at the top card of your deck, and put it on the top of your deck or into your waiting room\\.?$"
    metadata:
      family: AssistOrScalingPower
      targets:
        - SelfDeckTop

  - id: parser_v2.cont.facing_opponent_quoted_restriction_exact
    description: Exact facing-opponent quoted restriction conversion.
    mode: exact
    priority: 1195
    match_on: body
    kind: Continuous
    effect_mode: facing_opponent_quoted_restriction
    pattern: "^the character facing this card gets\\s*\"(?P<quoted>.+)\"\\.?$"
    metadata:
      family: FollowingAbilityGrant
      targets:
        - OppFrontRow

  - id: parser_v2.auto.on_play_power_following_quote_exact
    description: Exact on-play self power plus quoted following ability.
    mode: exact
    priority: 1195
    match_on: body
    timing: OnPlay
    effect_mode: on_play_power_following_quote
    pattern: "^when this card is placed on (?:the )?stage from your hand, this card gets \\+(?P<amount>\\d+) power and the following ability until the end of your opponent's next turn\\.\\s*\"(?P<quoted>.+)\"\\.?$"
    metadata:
      family: FollowingAbilityGrant
      targets:
        - This

  - id: parser_v2.cont.marker_power_exact
    description: Exact marker-gated continuous self power.
    mode: exact
    priority: 1195
    match_on: body
    kind: Continuous
    effect_mode: marker_power_exact
    pattern: "^if there is a marker underneath this card, this card gets \\+(?P<power>\\d+) power\\.?$"
    metadata:
      family: AssistOrScalingPower
      targets:
        - This

  - id: parser_v2.cont.marker_power_soul_exact
    description: Exact marker-gated continuous self power and soul.
    mode: exact
    priority: 1195
    match_on: body
    kind: Continuous
    effect_mode: marker_power_soul_exact
    pattern: "^if there is a marker underneath this card, this card gets \\+(?P<power>\\d+) power and \\+(?P<soul>\\d+) soul\\.?$"
    metadata:
      family: AssistOrScalingPower
      targets:
        - This

  - id: parser_v2.cont.marker_power_following_exact
    description: Exact marker-gated power with quoted following ability payload.
    mode: exact
    priority: 1195
    match_on: body
    kind: Continuous
    effect_mode: marker_power_following_exact
    pattern: "^if there is a marker underneath this card, this card gets \\+(?P<power>\\d+) power and the following ability\\.\\s*\"(?P<quoted>.+)\"\\.?$"
    metadata:
      family: FollowingAbilityGrant
      targets:
        - This

  - id: parser_v2.cont.experience_power_with_optional_following_exact
    description: Exact experience level-total power, including quoted follow-up payloads.
    mode: exact
    priority: 1195
    match_on: body
    kind: Continuous
    effect_mode: experience_power_with_optional_following_exact
    pattern: "^experience(?P<self_turn>\\s+during your turn)?, if the total level of (?:the )?cards in your level is (?P<level_total>(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)) or higher, this card gets \\+(?P<power>\\d+) power(?: and the following ability\\.\\s*\"(?P<quoted>.+)\")?\\.?$"
    metadata:
      family: Experience
      targets:
        - This

  - id: parser_v2.auto.paid_on_play_salvage_optional_buff_exact
    description: Exact paid on-play salvage with optional trailing team power clause.
    mode: exact
    priority: 1195
    match_on: body
    timing: OnPlay
    effect_mode: move_to_hand
    pattern: "^(?:\\[[^\\]]+\\]\\s*)?when this card is placed on (?:the )?stage from your hand, you may pay the cost\\. if you do, choose (?:up to )?(?P<count>(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)) (?P<selector>.+?) in your waiting room, return (?:it|them) to your hand(?:, choose .+?, and that character gets \\+\\d+ power until end of turn)?\\.?$"
    metadata:
      family: PaidOnPlaySearchSalvage
      targets:
        - SelfWaitingRoom
      target_limit_group: count

  - id: parser_v2.auto.paid_on_play_search_to_hand_exact
    description: Exact paid on-play deck search to hand.
    mode: exact
    priority: 1195
    match_on: body
    timing: OnPlay
    effect_mode: move_to_hand
    pattern: "^(?:\\[[^\\]]+\\]\\s*)?when this card is placed on (?:the )?stage from your hand, you may pay the cost\\. if you do, search your deck for up to (?P<count>(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)) (?P<selector>.+?), reveal (?:it|them) to your opponent, put (?:it|them) into your hand, and shuffle your deck(?: afterwards)?\\.?$"
    metadata:
      family: PaidOnPlaySearchSalvage
      targets:
        - SelfDeckTop
      target_limit_group: count

  - id: parser_v2.auto.climax_placed_buff_or_following_exact
    description: Exact climax-placed team buff/following conversion.
    mode: exact
    priority: 1195
    match_on: body
    timing: AfterClimaxPhase
    effect_mode: climax_placed_buff_or_following_exact
    pattern: "^when (?:your|a) climax is placed on your climax area, choose (?:up to )?(?P<count>(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)) of your characters, and (?:that character gets \\+(?P<power>\\d+) power(?: and \\+(?P<soul>\\d+) soul)? until end of turn|that character gets the following ability until end of turn\\.\\s*\"(?P<quoted>.+)\")\\.?$"
    metadata:
      family: ClimaxPlacedBuff
      targets:
        - SelfStage
      target_limit_group: count

  - id: parser_v2.auto.on_reverse_move_self_to_memory_exact
    description: Exact self OnReverse move-to-memory conversion.
    mode: exact
    priority: 1195
    match_on: body
    timing: OnReverse
    effect_mode: move_self_to_memory
    pattern: "^when this card becomes 【reverse】(?: in battle)?(?:,\\s*)?(?:you may )?put this card into your memory\\.?$"
    metadata:
      family: OnReverseSelfMove
      targets:
        - This

  - id: parser_v2.auto.on_reverse_move_self_to_deck_bottom_exact
    description: Exact self OnReverse move-to-deck-bottom conversion.
    mode: exact
    priority: 1195
    match_on: body
    timing: OnReverse
    effect_mode: move_self_to_deck_bottom
    pattern: "^when this card becomes 【reverse】(?: in battle)?, put this card at the bottom of your deck\\.?$"
    metadata:
      family: OnReverseSelfMove
      targets:
        - This

  - id: parser_v2.auto.battle_reverse_move_self_to_memory_exact
    description: Exact battle-opponent reverse self move-to-memory conversion.
    mode: exact
    priority: 1195
    match_on: body
    timing: BattleOpponentReverse
    effect_mode: move_self_to_memory
    pattern: "^when this card's battle opponent becomes 【reverse】, you may put this card into your memory(?:\\. if you do, .+)?$"
    metadata:
      family: OnReverseSelfMove
      targets:
        - This

  - id: parser_v2.auto.terminal_result_exact
    description: Exact terminal outcome direct statements.
    mode: exact
    priority: 1195
    match_on: body
    effect_mode: terminal_result_from_group
    pattern: "^you (?P<result>win|lose) the game\\.?$"
    metadata:
      family: terminal_effect

  - id: parser_v2.auto.terminal_result_conditional_exact
    description: Exact terminal outcome conditional statements.
    mode: exact
    priority: 1195
    match_on: body
    effect_mode: terminal_result_from_group
    pattern: "^if [^,]+, you (?P<result>win|lose) the game\\.?$"
    metadata:
      family: terminal_effect
