{
  "rules": [
    {
      "description": "Exact fallback for broad all-player following grants with a known quote payload.",
      "effect_mode": "cannot_side_attack",
      "id": "parser_v2.following_ability.all_players_cannot_side_attack_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "following_ability"
      },
      "mode": "exact",
      "pattern": "^all of (?:your|your opponent's) characters get the following ability(?: until end of turn)?\\.\\s*\"\u3010CONT\u3011 This card cannot side attack\\.\"\\.?$",
      "priority": 1200
    },
    {
      "description": "Approx fallback for all-player following-ability grants with quoted payloads.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.following_ability.all_players_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "all_players_following_action"
      },
      "mode": "approx",
      "pattern": "^all of (?:your|your opponent's) characters get the following ability(?: until (?:the end of your opponent's next turn|end of turn))?\\.\\s*\"[^\"]+\"\\.?$",
      "priority": 1150
    },
    {
      "description": "Approx fallback for choose-character following-ability grants.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.following_ability.choose_character_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "following_ability"
      },
      "mode": "approx",
      "pattern": "^choose (?:up to )?(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten) of (?:your|your opponent's) characters(?: in battle)?, and that character gets the following ability(?: until (?:the end of your opponent's next turn|end of turn))?\\.\\s*\"[^\"]+\"\\.?$",
      "priority": 1100
    },
    {
      "description": "Approx fallback for \"When you use this card's ...\" lines with quoted or following-ability payloads.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.auto.use_this_cards_ability_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "use_this_card_ability"
      },
      "mode": "approx",
      "pattern": "^when you use this card's .*(?:following ability|\"[^\"]+\").*$",
      "priority": 1050
    },
    {
      "description": "Approx fallback for brainstorm lines with custom quoted actions.",
      "effect_mode": "brainstorm_draw_approx",
      "id": "parser_v2.act.brainstorm_custom_action_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "brainstorm_custom_action"
      },
      "mode": "approx",
      "pattern": "^brainstorm\\s+(?:flip over|reveal)\\s+(?P<reveal_count>\\d+)\\s+cards?\\s+from the top of your deck, and put them into your waiting room\\.\\s+for each climax revealed(?: among those cards)?,\\s*perform the following action\\.\\s*\"[^\"]+\"\\.?$",
      "priority": 1000
    },
    {
      "description": "Approx fallback for broad all-players quoted action templates.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.generic.all_players_following_action",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "all_players_following_action"
      },
      "mode": "approx",
      "pattern": "^all players perform the following action\\.\\s*\"[^\"]+\"\\.?$",
      "priority": 950
    },
    {
      "description": "Approx fallback for broad quoted-grant lines that did not match higher-priority rules.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.quoted_grant.broad_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "broad_quoted_grant"
      },
      "mode": "approx",
      "pattern": "^(?:this card|all of your characters|all of your opponent's characters|the character facing this card|choose .+?) get(?:s)?(?: the following ability)?(?: until [^.]+)?(?:\\.\\s*|\\s+)\"[^\"]+\"\\.?$",
      "priority": 900
    },
    {
      "description": "Last-resort approx fallback for any remaining quoted following-ability text.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.following_ability.very_broad_generic",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "following_ability"
      },
      "mode": "approx",
      "pattern": "^.*following ability.*\"[^\"]+\".*$",
      "priority": 850
    },
    {
      "description": "Strict fallback for following-ability lines that keep a quoted payload.",
      "effect_mode": "noop_draw_exact",
      "id": "parser_v2.strict.following_ability_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "FollowingAbilityGrant"
      },
      "mode": "exact",
      "pattern": "^.*following ability.*\".*\".*$",
      "priority": 0
    },
    {
      "description": "Strict fallback for broad paid on-play search/salvage text families.",
      "effect_mode": "paid_on_play_search_or_salvage_generic_exact",
      "id": "parser_v2.strict.paid_on_play_search_salvage_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "PaidOnPlaySearchSalvage"
      },
      "mode": "exact",
      "pattern": "^.*placed on (?:the )?stage from your hand.*pay the cost.*(?:look at|search|return .* to your hand).*$",
      "priority": -2
    },
    {
      "description": "Strict fallback for experience family lines.",
      "effect_mode": "experience_generic_exact",
      "id": "parser_v2.strict.experience_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "Experience"
      },
      "mode": "exact",
      "pattern": "^experience .+$",
      "priority": -3
    },
    {
      "description": "Strict fallback for climax-placed buff family lines.",
      "effect_mode": "climax_placed_buff_generic_exact",
      "id": "parser_v2.strict.climax_placed_buff_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "ClimaxPlacedBuff"
      },
      "mode": "exact",
      "pattern": "^when (?:your|a) climax is placed on your climax area.*$",
      "priority": -3
    },
    {
      "description": "Strict fallback for OnReverse self-move family lines.",
      "effect_mode": "on_reverse_self_move_generic_exact",
      "id": "parser_v2.strict.on_reverse_self_move_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "OnReverseSelfMove"
      },
      "mode": "exact",
      "pattern": "^.*becomes 【reverse】.*(?:put this card at the bottom of your deck|put this card into your memory).*$",
      "priority": -3
    },
    {
      "description": "Strict fallback for assist/scaling power family lines with explicit numeric power.",
      "effect_mode": "add_power_generic_exact",
      "id": "parser_v2.strict.assist_or_scaling_power_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "AssistOrScalingPower"
      },
      "mode": "exact",
      "pattern": "^.*gets \\+(?P<amount>\\d+) power.*$",
      "priority": -4
    },
    {
      "description": "Strict fallback for scaling-power X-valued templates.",
      "effect_mode": "noop_draw_exact",
      "id": "parser_v2.strict.scaling_power_x_generic_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "AssistOrScalingPower"
      },
      "mode": "exact",
      "pattern": "^.*gets \\+x power.*$",
      "priority": -5
    },
    {
      "description": "Strict fallback for remaining quoted lines after family-specific strict rules.",
      "effect_mode": "noop_draw_exact",
      "id": "parser_v2.strict.any_quoted_line_exact",
      "match_on": "body",
      "metadata": {
        "confidence": "exact",
        "family": "quoted_catch_all_strict"
      },
      "mode": "exact",
      "pattern": "^.*\".*\".*$",
      "priority": -20
    },
    {
      "description": "Catch-all approx fallback for any remaining unmatched tagged line.",
      "effect_mode": "noop_draw",
      "id": "parser_v2.any.unmatched_tagged_line",
      "match_on": "body",
      "metadata": {
        "confidence": "approx",
        "family": "unmatched_catch_all"
      },
      "mode": "approx",
      "pattern": "^.+$",
      "priority": -100
    }
  ],
  "version": 1
}
