[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "weiss-sim"
version = "1.2.0"
description = "Deterministic Weiss Schwarz simulator with a Rust core and Python bindings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Victor Wejergang Petersen" }]
keywords = ["weiss-schwarz", "reinforcement-learning", "simulation", "pyo3", "rl"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "maturin>=1.5",
  "pip-audit>=2.7",
  "pytest>=8",
  "ruff==0.15.15",
]

[project.urls]
Homepage = "https://github.com/victorwp288/weiss-schwarz-simulator"
Repository = "https://github.com/victorwp288/weiss-schwarz-simulator"
Documentation = "https://github.com/victorwp288/weiss-schwarz-simulator/blob/main/docs/README.md"
Rustdoc = "https://victorwp288.github.io/weiss-schwarz-simulator/rustdoc/"
Issues = "https://github.com/victorwp288/weiss-schwarz-simulator/issues"
Changelog = "https://github.com/victorwp288/weiss-schwarz-simulator/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "weiss_py/Cargo.toml"
python-source = "python"
module-name = "weiss_sim"
include = [
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "python/weiss_sim/data/*.json",
  "python/weiss_sim/data/*.json.gz",
  "python/weiss_sim/data/*.wsdb",
  "python/weiss_sim/py.typed",
  "python/weiss_sim/weiss_sim.pyi",
]

[tool.ruff]
required-version = "0.15.14"
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
