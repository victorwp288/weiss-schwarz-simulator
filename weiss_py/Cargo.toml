[package]
name = "weiss_py"
version = "1.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "PyO3 bindings for the deterministic Weiss Schwarz simulator."
repository = "https://github.com/victorwp288/weiss-schwarz-simulator"
homepage = "https://github.com/victorwp288/weiss-schwarz-simulator"
documentation = "https://victorwp288.github.io/weiss-schwarz-simulator/rustdoc/"
readme = "../README.md"

[lib]
name = "weiss_py"
crate-type = ["cdylib"]
doc = false

[dependencies]
weiss_core = { path = "../weiss_core", version = "1.2.1" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.maturin]
name = "weiss_sim"
