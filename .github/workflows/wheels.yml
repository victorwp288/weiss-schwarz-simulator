name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/wheels.yml"
      - "weiss_core/**"
      - "weiss_py/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: .
          command: sdist
          args: --manifest-path weiss_py/Cargo.toml --out dist
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  build:
    name: Build wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            manylinux: "2014"
            interpreter: /opt/python/cp310-cp310/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp310-cp310/bin/python
          - os: ubuntu-latest
            python-version: "3.11"
            manylinux: "2014"
            interpreter: /opt/python/cp311-cp311/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp311-cp311/bin/python
          - os: ubuntu-latest
            python-version: "3.12"
            manylinux: "2014"
            interpreter: /opt/python/cp312-cp312/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp312-cp312/bin/python
          - os: windows-latest
            python-version: "3.10"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: windows-latest
            python-version: "3.11"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: windows-latest
            python-version: "3.12"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: macos-latest
            python-version: "3.10"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
          - os: macos-latest
            python-version: "3.11"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
          - os: macos-latest
            python-version: "3.12"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: .
          command: build
          # use manylinux container for linux; use host python for mac/windows via --interpreter python
          args: ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  release:
    name: Publish (GitHub Releases + PyPI)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sdist, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
