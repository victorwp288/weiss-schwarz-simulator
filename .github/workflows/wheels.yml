name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/wheels.yml"
      - "weiss_core/**"
      - "weiss_py/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: .
          command: sdist
          maturin-version: "1.8.2"
          args: --manifest-path weiss_py/Cargo.toml --out dist
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*

  build:
    name: Build wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            manylinux: "2014"
            interpreter: /opt/python/cp310-cp310/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp310-cp310/bin/python
          - os: ubuntu-latest
            python-version: "3.11"
            manylinux: "2014"
            interpreter: /opt/python/cp311-cp311/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp311-cp311/bin/python
          - os: ubuntu-latest
            python-version: "3.12"
            manylinux: "2014"
            interpreter: /opt/python/cp312-cp312/bin/python
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter /opt/python/cp312-cp312/bin/python
          - os: windows-latest
            python-version: "3.10"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: windows-latest
            python-version: "3.11"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: windows-latest
            python-version: "3.12"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          - os: macos-latest
            python-version: "3.10"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
          - os: macos-latest
            python-version: "3.11"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
          - os: macos-latest
            python-version: "3.12"
            manylinux: ""
            args: --release --manifest-path weiss_py/Cargo.toml --out dist --target universal2-apple-darwin --interpreter python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: .
          command: build
          maturin-version: "1.8.2"
          # use manylinux container for linux; use host python for mac/windows via --interpreter python
          args: ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - name: Smoke installed wheel
        run: |
          python -m pip install -U pip numpy
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', *wheels])"
          python -c "import weiss_sim; env = weiss_sim.fast(num_envs=1, seed=7); batch = env.reset(); actions = batch.legal.first_legal(); step = env.step(actions); assert step.obs.shape[0] == 1; env.close()"
          python -c "import importlib.resources as r, weiss_sim; expected = {'starter_deck_ws02_v1', 'control_deck_jj_s66_v1', 'main_deck_5hy_yotsuba_v1', 'aggro_deck_5hy_nino_v1'}; assert expected == set(weiss_sim.cards.presets()); assert weiss_sim.cards.preset_min_rules_profile('main_deck_5hy_yotsuba_v1') == 'approx'; data = r.files('weiss_sim').joinpath('data'); [data.joinpath(name).read_bytes() for name in ('default_cards.wsdb', 'card_catalog.json.gz', 'catalog_meta.json', 'deck_presets.json', 'deck_preset_meta.json')]"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  release:
    name: Publish (GitHub Releases + PyPI)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sdist, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
