name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'weiss_core/**'
              - 'weiss_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'python/**'
              - 'scraper/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'weiss_py/**'
            docs:
              - 'README.md'
              - 'PROJECT_STATE.md'
              - 'docs/**'
              - 'scripts/check_docs_links.py'
              - 'scripts/check_docs_constants.py'

  ci:
    name: ci
    needs: [changes, docs, rust, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "rust=${{ needs.rust.result }}"
          echo "python=${{ needs.python.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" && "${{ needs.docs.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.rust.result }}" != "success" && "${{ needs.rust.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.python.result }}" != "success" && "${{ needs.python.result }}" != "skipped" ]]; then
            exit 1
          fi

  docs:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs link check
        run: python scripts/check_docs_links.py
      - name: Docs constants check
        run: python scripts/check_docs_constants.py

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check env layering
        run: scripts/check_env_layering.sh
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --features test-harness
      - name: Cargo build (release)
        run: cargo build -p weiss_core --release

  python:
    name: Python (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install ruff==0.12.12 maturin pytest numpy
      - name: Ruff format
        run: ruff format --check python scraper scripts
      - name: Ruff lint
        run: ruff check python scraper scripts
      - name: Build + install extension (wheel)
        run: |
          maturin build --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          python -m pip install dist/*.whl
      - name: Pytest
        run: pytest -q python/tests
