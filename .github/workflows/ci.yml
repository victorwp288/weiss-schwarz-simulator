name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '.gitattributes'
              - '.github/**'
              - 'weiss_core/**'
              - 'weiss_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/check_env_layering.sh'
              - 'scripts/strip_rust_layering.py'
            python:
              - '.gitattributes'
              - '.github/**'
              - 'python/**'
              - 'scraper/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'weiss_py/**'
            docs:
              - '.gitattributes'
              - '.github/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - 'docs/**'
              - 'scripts/check_docs_links.py'
              - 'scripts/check_docs_constants.py'
              - 'scripts/gen_docs_snippets.py'
            perf:
              - '.gitattributes'
              - '.github/**'
              - 'weiss_core/**'
              - 'weiss_py/**'
              - 'python/examples/bench_python_boundary.py'
              - 'benchmark/**'
              - 'scripts/check_perf_budget.py'
              - 'scripts/run_perf_snapshot.sh'
              - '.github/workflows/ci.yml'

  ci:
    name: ci
    needs: [changes, docs, rust, python, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "rust=${{ needs.rust.result }}"
          echo "python=${{ needs.python.result }}"
          echo "perf=${{ needs.perf.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" && "${{ needs.docs.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.rust.result }}" != "success" && "${{ needs.rust.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.python.result }}" != "success" && "${{ needs.python.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.perf.result }}" != "success" && "${{ needs.perf.result }}" != "skipped" ]]; then
            exit 1
          fi

  docs:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Docs link check
        run: python scripts/check_docs_links.py
      - name: Docs constants check
        run: python scripts/check_docs_constants.py
      - name: Generated docs check
        run: python scripts/gen_docs_snippets.py --check

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check env layering
        run: scripts/check_env_layering.sh
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --all-features
      - name: Cargo build (release)
        run: cargo build -p weiss_core --release

  python:
    name: Python (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install ruff==0.15.14 maturin pytest numpy
      - name: Ruff format
        run: ruff format --check python scraper scripts
      - name: Ruff lint
        run: ruff check python scraper scripts
      - name: Generated docs check
        run: python scripts/gen_docs_snippets.py --check
      - name: Packaged data freshness
        run: python scripts/check_packaged_data.py
      - name: Ability coverage report
        run: python scripts/ability_coverage_report.py --output /tmp/ability_coverage_report.json
      - name: Ability coverage targets
        run: python scripts/ability_coverage_targets.py --report /tmp/ability_coverage_report.json --output /tmp/ability_coverage_targets.json
      - name: Coverage budget regression gate
        run: |
          python scripts/check_coverage_budget.py \
            --report /tmp/ability_coverage_report.json \
            --baseline scripts/ability_coverage_baseline.json \
            --min-parse-line-coverage-strict 0.52 \
            --max-unsupported-lines-strict 14200 \
            --min-card-coverage-approx 0.99
      - name: Scraper parser unittest
        run: python -m unittest scraper.test_convert
      - name: Build + install extension (wheel)
        run: |
          maturin build --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          python -m pip install dist/*.whl
      - name: Pytest
        run: pytest -q python/tests
      - name: Upload ability coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ability-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ability_coverage_report.json
            /tmp/ability_coverage_targets.json
          if-no-files-found: warn

  perf:
    name: Performance budget
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install maturin numpy
      - name: Resolve baseline commit
        id: resolve-base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}"
            BASE_SHA="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD^)"
            else
              BASE_SHA="$GITHUB_SHA"
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved perf baseline commit: $BASE_SHA"
      - name: Prepare perf worktrees
        run: |
          rm -rf /tmp/wss_base /tmp/wss_head /tmp/wss_perf_before /tmp/wss_perf_after
          git worktree add --detach /tmp/wss_head "$GITHUB_SHA"
          git worktree add --detach /tmp/wss_base "${{ steps.resolve-base.outputs.base_sha }}"
      - name: Snapshot baseline (base commit)
        env:
          PERF_SNAPSHOT_PROFILE: light
        run: |
          python -m maturin develop --release --manifest-path /tmp/wss_base/weiss_py/Cargo.toml
          bash "$GITHUB_WORKSPACE/scripts/run_perf_snapshot.sh" /tmp/wss_perf_before /tmp/wss_base
      - name: Snapshot current (head commit)
        env:
          PERF_SNAPSHOT_PROFILE: light
        run: |
          python -m maturin develop --release --manifest-path /tmp/wss_head/weiss_py/Cargo.toml
          bash "$GITHUB_WORKSPACE/scripts/run_perf_snapshot.sh" /tmp/wss_perf_after /tmp/wss_head
      - name: Enforce perf budget
        run: |
          python /tmp/wss_head/scripts/check_perf_budget.py \
            --baseline-benches /tmp/wss_perf_before/benches.txt \
            --current-benches /tmp/wss_perf_after/benches.txt \
            --baseline-python /tmp/wss_perf_before/python_bench.txt \
            --current-python /tmp/wss_perf_after/python_bench.txt \
            --max-core-regression-pct 30 \
            --core-budget-override reset_batch_256=35 \
            --max-python-regression-pct 25 \
            --require-zero-alloc
      - name: Cleanup perf worktrees
        if: always()
        run: |
          git worktree remove --force /tmp/wss_base || true
          git worktree remove --force /tmp/wss_head || true
          rm -rf /tmp/wss_base /tmp/wss_head
