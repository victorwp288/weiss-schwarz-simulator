name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'weiss_core/**'
              - 'weiss_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'python/**'
              - 'scraper/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'weiss_py/**'
            docs:
              - 'README.md'
              - 'PROJECT_STATE.md'
              - 'docs/**'
              - 'scripts/check_docs_links.py'
              - 'scripts/check_docs_constants.py'
            perf:
              - 'weiss_core/**'
              - 'weiss_py/**'
              - 'python/examples/bench_python_boundary.py'
              - 'benchmark/**'
              - 'scripts/check_perf_budget.py'
              - '.github/workflows/ci.yml'

  ci:
    name: ci
    needs: [changes, docs, rust, python, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "rust=${{ needs.rust.result }}"
          echo "python=${{ needs.python.result }}"
          echo "perf=${{ needs.perf.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" && "${{ needs.docs.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.rust.result }}" != "success" && "${{ needs.rust.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.python.result }}" != "success" && "${{ needs.python.result }}" != "skipped" ]]; then
            exit 1
          fi

          if [[ "${{ needs.perf.result }}" != "success" && "${{ needs.perf.result }}" != "skipped" ]]; then
            exit 1
          fi

  docs:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs link check
        run: python scripts/check_docs_links.py
      - name: Docs constants check
        run: python scripts/check_docs_constants.py

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check env layering
        run: scripts/check_env_layering.sh
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --features test-harness
      - name: Cargo build (release)
        run: cargo build -p weiss_core --release

  python:
    name: Python (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install ruff==0.12.12 maturin pytest numpy
      - name: Ruff format
        run: ruff format --check python scraper scripts
      - name: Ruff lint
        run: ruff check python scraper scripts
      - name: Ability coverage report
        run: python scripts/ability_coverage_report.py --output /tmp/ability_coverage_report.json
      - name: Ability coverage targets
        run: python scripts/ability_coverage_targets.py --report /tmp/ability_coverage_report.json --output /tmp/ability_coverage_targets.json
      - name: Coverage budget regression gate
        run: |
          python scripts/check_coverage_budget.py \
            --report /tmp/ability_coverage_report.json \
            --baseline scripts/ability_coverage_baseline.json \
            --min-parse-line-coverage-strict 0.52 \
            --max-unsupported-lines-strict 14200 \
            --min-card-coverage-approx 0.99
      - name: Build + install extension (wheel)
        run: |
          maturin build --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          python -m pip install dist/*.whl
      - name: Pytest
        run: pytest -q python/tests
      - name: Upload ability coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ability-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ability_coverage_report.json
            /tmp/ability_coverage_targets.json
          if-no-files-found: warn

  perf:
    name: Performance budget
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install maturin numpy
      - name: Build + install extension (perf)
        run: python -m maturin develop --release --manifest-path weiss_py/Cargo.toml
      - name: Capture baseline snapshots
        run: |
          mkdir -p /tmp/wss_perf_before /tmp/wss_perf_after
          cp benchmark/benches.txt /tmp/wss_perf_before/benches.txt
          cp benchmark/python_bench.txt /tmp/wss_perf_before/python_bench.txt
      - name: Run rust benches
        run: |
          cargo bench -p weiss_core --bench core_benches -- --output-format bencher | tee /tmp/wss_perf_after/benches.txt
          cargo bench -p weiss_core --bench alloc_benches -- --output-format bencher | tee -a /tmp/wss_perf_after/benches.txt
      - name: Run python boundary bench
        run: |
          PYTHONPATH=python python python/examples/bench_python_boundary.py \
            --num-envs 128 \
            --steps 2000 \
            --warmup 200 \
            --reset-reps 200 \
            --mode both | tee /tmp/wss_perf_after/python_bench.txt
      - name: Enforce perf budget
        run: |
          python scripts/check_perf_budget.py \
            --baseline-benches /tmp/wss_perf_before/benches.txt \
            --current-benches /tmp/wss_perf_after/benches.txt \
            --baseline-python /tmp/wss_perf_before/python_bench.txt \
            --current-python /tmp/wss_perf_after/python_bench.txt \
            --max-core-regression-pct 15 \
            --max-python-regression-pct 10 \
            --require-zero-alloc