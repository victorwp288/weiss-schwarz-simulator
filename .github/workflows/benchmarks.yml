name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "scripts/bench_to_readme.py"
      - "weiss_core/**"
      - "weiss_py/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benches_pr:
    name: benches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Benchmarks run on main pushes; PRs skip heavy bench runs."

  benches:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gh-pages branch exists
        run: |
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "gh-pages exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          mkdir -p benchmarks rustdoc
          touch .nojekyll
          git add .nojekyll benchmarks rustdoc
          git commit -m "chore: init gh-pages"
          git push origin gh-pages
          git checkout main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Python tooling
        run: |
          python -m pip install -U pip
          python -m pip install maturin numpy
      - name: Run Criterion benches
        run: |
          mkdir -p /tmp/benchmark-run
          cargo bench -p weiss_core --bench core_benches -- --output-format bencher | tee /tmp/benchmark-run/benches.txt
          cargo bench -p weiss_core --bench alloc_benches -- --output-format bencher | tee -a /tmp/benchmark-run/benches.txt
      - name: Build + install extension (wheel)
        run: |
          maturin build --release --manifest-path weiss_py/Cargo.toml --out dist --interpreter python
          python -m pip install dist/*.whl
      - name: Run Python benchmarks
        run: |
          python python/examples/bench_python_boundary.py --num-envs 128 --steps 2000 --warmup 200 --reset-reps 200 --mode both | tee /tmp/benchmark-run/python_bench.txt
      - name: Publish benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "cargo"
          output-file-path: /tmp/benchmark-run/benches.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: benchmarks
      - name: Make benchmark charts visible (single-run friendly)
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path("benchmarks/index.html")
          if not path.exists():
            raise SystemExit("benchmarks/index.html not found on gh-pages")

          html = path.read_text(encoding="utf-8")
          updated = html.replace("cargo: '#dea584',", "cargo: '#b45309',")

          needle = "backgroundColor: color + '60', // Add alpha for #rrggbbaa"
          if needle in updated and "pointRadius:" not in updated:
            updated = updated.replace(
              needle,
              needle
              + "\n                  pointRadius: dataset.length > 1 ? 2 : 5,"
              + "\n                  pointHoverRadius: dataset.length > 1 ? 4 : 7,"
              + "\n                  borderWidth: 2,",
            )

          if updated != html:
            path.write_text(updated, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "No benchmark page changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add benchmarks/index.html
            git commit -m "chore: tweak benchmark chart visibility"
            git push origin gh-pages
          fi
          git checkout main
      - name: Update README benchmark snapshot
        run: |
          python scripts/bench_to_readme.py \
            --input /tmp/benchmark-run/benches.txt \
            --python-input /tmp/benchmark-run/python_bench.txt \
            --readme README.md \
            --max 12
      - name: Commit README update
        run: |
          if git diff --quiet; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update benchmark snapshot [skip ci]"
          git push
