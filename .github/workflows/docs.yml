name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "weiss_core/**"
      - "weiss_py/**"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.run_id) || 'gh-pages' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust docs (PR)
        if: github.event_name == 'pull_request'
        run: cargo doc -p weiss_core --no-deps
      - name: Build Rust docs (publish)
        if: github.event_name != 'pull_request'
        run: cargo doc --workspace --no-deps
      - name: Ensure rustdoc index.html
        if: github.event_name != 'pull_request'
        run: |
          if [ -f target/doc/index.html ]; then
            echo "target/doc/index.html already exists."
            exit 0
          fi

          entries=""
          for d in target/doc/*; do
            name="$(basename "$d")"
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then
              case "$name" in
                src|static.files|static.assets|implementors)
                  continue
                  ;;
              esac
              entries="${entries}<li><a href=\"./${name}/\">${name}</a></li>\n"
            fi
          done

          cat > target/doc/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Rust API docs</title>
              <style>
                :root { color-scheme: light dark; }
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
                code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              </style>
            </head>
            <body>
              <h1>Rust API docs</h1>
              <p>Crates:</p>
              <ul>
          EOF
          printf "%b" "$entries" >> target/doc/index.html
          cat >> target/doc/index.html <<'EOF'
              </ul>
            </body>
          </html>
          EOF
      - name: Publish to GitHub Pages (gh-pages/rustdoc)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc
          destination_dir: rustdoc
          keep_files: true
      - name: Build Pages index
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p pages-root
          cat > pages-root/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>weiss-schwarz-simulator</title>
              <style>
                :root { color-scheme: light dark; }
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
                h1 { margin: 0 0 8px; }
                ul { padding-left: 18px; }
                code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              </style>
            </head>
            <body>
              <h1>weiss-schwarz-simulator</h1>
              <p>Project pages for docs & benchmarks.</p>
              <ul>
                <li><a href="./rustdoc/">Rust API docs</a></li>
                <li><a href="./benchmarks/">Benchmarks</a></li>
                <li><a href="https://github.com/victorwp288/weiss-schwarz-simulator">GitHub repository</a></li>
              </ul>
              <p><small>Generated by GitHub Actions.</small></p>
            </body>
          </html>
          EOF
          touch pages-root/.nojekyll
      - name: Publish index to GitHub Pages (gh-pages/)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-root
          keep_files: true
