name: Bug report
description: Report a simulator, binding, or packaging bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or code that reproduce the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Rust version, package version or commit.
      render: text
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact area
      options:
        - Rust core
        - Python API
        - PyO3 bindings
        - Card database or scraper
        - Replay or fingerprint
        - Packaging or CI
        - Documentation
    validations:
      required: true
